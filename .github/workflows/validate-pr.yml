name: Validate PR

# 必須チェックにするため、全 PR で動かす。contributors.json を変更していない PR では検証を飛ばして成功にする
# （パス条件で起動しないと、必須チェックが「待ち」のままになり、マージできなくなるため）
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether contributors.json is changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- data/contributors.json; then
            echo "contributors.json の変更がないため検証しません"
            echo "CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: env.CHANGED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: env.CHANGED == 'true'
        run: npm ci

      - name: Validate contributors.json format
        if: env.CHANGED == 'true'
        run: npx tsx scripts/validate-contributors.ts

      - name: Verify no modifications or deletions of existing entries
        if: env.CHANGED == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # 既存エントリが中身ごと残っているかを確かめる（github 欄は比べない。ADR-0016）
          git show origin/main:data/contributors.json > /tmp/contributors.main.json
          node scripts/check-existing-entries.mjs /tmp/contributors.main.json data/contributors.json

      - name: Check addition limit (1 entry per PR)
        if: env.CHANGED == 'true'
        run: |
          echo "Checking addition count..."
          BEFORE_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/contributors.main.json','utf8')).length)")
          AFTER_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/contributors.json','utf8')).length)")
          DIFF=$((AFTER_COUNT - BEFORE_COUNT))
          if [ "$DIFF" -gt 1 ]; then
            echo ""
            echo "❌ 追加エントリが多すぎます（+${DIFF} 件）"
            echo ""
            echo "   💡 1 回の PR では 1 エントリだけ追加してください"
            exit 1
          fi
          if [ "$DIFF" -lt 0 ]; then
            echo ""
            echo "❌ エントリが減っています（${DIFF} 件）"
            exit 1
          fi
          echo "✅ 追加エントリ数 OK (+${DIFF} 件)"

      - name: Build (本番デプロイと同じ basePath で検証)
        if: env.CHANGED == 'true'
        env:
          NEXT_PUBLIC_GITHUB_PAGES: 'true'
        run: npm run build

      - name: Success
        if: env.CHANGED == 'true'
        run: echo "✅ All checks passed!"
