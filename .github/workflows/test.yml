name: Test

# PR 時に lint / 単体テスト / ビルドを実行する。
# 失敗時は Branch Protection によりマージがブロックされる。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test -- --run

      - name: Build (Next.js, GitHub Pages 想定)
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      # NOTE: ESLint は既存エラー (8 件、audit-v4 由来) があるため、
      # 別 PR (#21 W-3〜W-5,W-8 系) でクリーンアップ後にこの workflow へ追加する。
