name: Test

# PR 時に lint / 単体テスト / ビルドを実行する。
# 失敗時は Branch Protection によりマージがブロックされる。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test -- --run

      - name: Build (Next.js, GitHub Pages 想定)
        env:
          NEXT_PUBLIC_GITHUB_PAGES: 'true'
        run: npm run build

      # 素の <a href="/..."> は GitHub Pages で basePath が付かず 404 になる。通常のビルドの E2E では見つからないため、ここで確かめる
      - name: Check links have the basePath
        run: node scripts/check-base-path-links.mjs out /git-training-ground

      # GitHub Pages は /tutorial/ を tutorial/index.html で返す。tutorial.html しかないと 404 になる（trailingSlash: true で作る）
      - name: Check pages open with a trailing slash
        run: test -f out/tutorial/index.html || { echo "❌ out/tutorial/index.html がありません。/tutorial/ が 404 になります（next.config.ts の trailingSlash を確かめてください）"; exit 1; }
