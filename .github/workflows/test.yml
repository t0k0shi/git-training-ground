name: Test

# PR 時に lint / 単体テスト / ビルドを実行する。
# 失敗時は Branch Protection によりマージがブロックされる。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test -- --run

      - name: Build (Next.js, GitHub Pages 想定)
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      # NOTE: GITHUB_PAGES env 名は予約名のためリネーム対象 (NEXT_GITHUB_PAGES 等)。
      # 現状は既存 deploy.yml / validate-pr.yml / next.config.ts と命名統一を優先。
      # 一括リネームは別 PR で実施 (関連: CodeRabbit 指摘 PR #30)。
